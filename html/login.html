<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk / Daftar — Allium</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <img src="/assets/logo.svg" alt="Allium logo" class="brand-logo">
      <span class="brand-name">Allium</span>
    </a>

    <div class="auth-tabs">
      <button class="auth-tab" id="tabLogin" type="button">Masuk</button>
      <button class="auth-tab" id="tabDaftar" type="button">Daftar</button>
    </div>

    <h2 id="formTitle" style="margin-bottom:18px;font-size:1.2rem;">Selamat datang kembali</h2>
    <div class="msg" id="msg"></div>

    <form id="authForm">
      <div class="field" id="nameField">
        <label for="fullname">Nama lengkap</label>
        <input type="text" id="fullname" name="fullname" placeholder="Nama Anda" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Masuk</button>
    </form>

    <p class="auth-alt">Dengan melanjutkan, Anda menyetujui Syarat &amp; Ketentuan kami.</p>
  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
