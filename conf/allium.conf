limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name allium.biz.id _;

    root /data/allium/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # static assets: long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # auth API -> Flask (rate limited)
    location = /api/daftar { limit_req zone=auth burst=5 nodelay; proxy_pass http://127.0.0.1:5000; include /data/allium/conf/proxy_params; }
    location = /api/masuk  { limit_req zone=auth burst=5 nodelay; proxy_pass http://127.0.0.1:5000; include /data/allium/conf/proxy_params; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        include /data/allium/conf/proxy_params;
    }

    # pretty URLs
    location /login  { try_files /login.html =404; }
    location /dashboard { try_files /dashboard.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
